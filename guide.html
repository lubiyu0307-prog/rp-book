<html lang="zh-TW">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<body>
<title>裝幀室使用指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root {
  --paper: #eef0f1;
  --panel: #f8f9f9;
  --ink: #1d2327;
  --muted: #5f6a73;
  --line: #d3d9dc;
  --cloth: #2f4858;
  --cloth-ink: #eef2f3;
  --gilt: #a9853a;
  --screen: #ffffff;
  --screen-ink: #202124;
  --screen-soft: #f1f3f4;
  --screen-line: #dadce0;
  --tick: #2f6fb0;
  --warn: #b3452f;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 10px 30px rgba(20,30,40,.10);
  --display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", serif;
  --ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14181b; --panel: #1b2024; --ink: #e4e7e9; --muted: #9aa4ad; --line: #2c3338;
    --cloth: #3f6377; --cloth-ink: #eef2f3; --gilt: #d0ad63;
    --screen: #202326; --screen-ink: #e6e8ea; --screen-soft: #2a2e32; --screen-line: #3a4046; --tick: #7fb0e6; --warn: #e07a62;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14181b; --panel: #1b2024; --ink: #e4e7e9; --muted: #9aa4ad; --line: #2c3338;
  --cloth: #3f6377; --cloth-ink: #eef2f3; --gilt: #d0ad63;
  --screen: #202326; --screen-ink: #e6e8ea; --screen-soft: #2a2e32; --screen-line: #3a4046; --tick: #7fb0e6; --warn: #e07a62;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  color-scheme: dark;
}
.hero { margin: 0 0 20px; max-width: 620px; }
.hero img { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: var(--shadow); }
* { box-sizing: border-box; }
/* 錄影模式（網址後面加 #video）：直式 9:16、只留畫面和字幕，自己從頭播一次 */
body.video { padding: 0; overflow: hidden; }
body.video .wrap { width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); max-width: none; margin: 0 auto; padding: 5% 5% 4%; gap: 3%; grid-template-rows: auto 1fr; overflow: hidden; }
body.video .hero, body.video .toc, body.video .controls, body.video .shot, body.video header p { display: none; }
body.video header h1 { font-size: clamp(1.1rem, 3.2vh, 2rem); text-align: center; }
body.video .grid { grid-template-columns: minmax(0, 1fr); gap: 0; align-content: start; }
body.video .stage { aspect-ratio: 3 / 4; }
body.video .caption { min-height: 0; }
body.video .caption h2 { font-size: clamp(1.1rem, 3vh, 1.8rem); }
body.video .caption p { font-size: clamp(.85rem, 1.9vh, 1.1rem); }
.endimg { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: var(--shadow); }

body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.65; padding: 0 16px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 22px; }
header h1 { font-family: var(--display); font-size: 2rem; letter-spacing: .08em; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 24px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* 舞台 */
.stage-box { display: grid; gap: 14px; }
.stage { position: relative; aspect-ratio: 16 / 10; width: 100%; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); overflow: hidden; display: grid; place-items: center; padding: 18px; }
@media (max-width: 560px) { .stage { aspect-ratio: 3 / 4; padding: 12px; } }
.device { width: 100%; height: 100%; background: var(--screen); color: var(--screen-ink); border-radius: 10px; border: 1px solid var(--screen-line);
  display: grid; grid-template-rows: auto 1fr; overflow: hidden; font-size: 13px; line-height: 1.5; }
.device.phone { width: auto; aspect-ratio: 9 / 18; max-height: 100%; border-radius: 26px; border: 8px solid #111; grid-template-rows: 1fr; }
.chrome { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--screen-soft); border-bottom: 1px solid var(--screen-line); }
.chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--screen-line); display: block; }
.url { flex: 1; min-width: 0; background: var(--screen); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen { position: relative; overflow: hidden; padding: 14px 16px; display: grid; align-content: start; gap: 8px; }
.phone .screen { padding: 22px 12px 12px; }
.s-title { font-weight: 700; font-size: 15px; margin: 0; }
.s-sub { color: var(--muted); font-size: 12px; margin: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--screen-line); border-radius: 8px; background: var(--screen); transition: background .3s, border-color .3s; }
.row .nm { flex: 1; min-width: 0; }
.row .nm small { display: block; color: var(--muted); font-size: 11px; }
.row.dim { opacity: .45; }
.row.hl { border-color: var(--tick); background: color-mix(in srgb, var(--tick) 8%, var(--screen)); }
.row.bad { border-color: var(--warn); }
.box { width: 16px; height: 16px; border-radius: 3px; border: 2px solid var(--muted); flex: none; position: relative; transition: background .2s, border-color .2s; }
.box.on { background: var(--tick); border-color: var(--tick); }
.box.on::after { content: ""; position: absolute; left: 4px; top: 0; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.pill { font-size: 11px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--screen-line); color: var(--tick); white-space: nowrap; transition: background .2s; }
.pill.on, .btn-s.on { background: color-mix(in srgb, var(--tick) 18%, var(--screen)); }
.btn-s { justify-self: start; font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--screen-line); background: var(--screen); color: var(--tick); transition: background .2s, transform .15s; }
.btn-s.primary { background: var(--tick); color: #fff; border-color: var(--tick); }
.btn-s.press { transform: scale(.94); }
.tag-warn { font-size: 11px; color: var(--warn); font-weight: 700; }
.dlg { position: absolute; inset: 10% 8%; background: var(--screen); border: 1px solid var(--screen-line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 14px; display: grid; align-content: start; gap: 8px; opacity: 0; transform: translateY(10px); transition: opacity .35s, transform .35s; pointer-events: none; }
.dlg.show { opacity: 1; transform: none; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.radio { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); flex: none; transition: border-width .2s, border-color .2s; }
.radio.on { border: 5px solid var(--tick); }
.mail { display: grid; gap: 6px; border: 1px solid var(--screen-line); border-radius: 8px; padding: 12px; }
.files { display: grid; gap: 4px; font-size: 12.5px; }
.file { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px; transition: background .25s, opacity .3s; }
.file.hl { background: color-mix(in srgb, var(--tick) 16%, var(--screen)); }
.file.hide { opacity: 0; }
.ico { width: 18px; height: 14px; border-radius: 2px; background: #7aa7d6; flex: none; position: relative; }
.ico.folder::before { content: ""; position: absolute; left: 0; top: -3px; width: 8px; height: 4px; border-radius: 2px 2px 0 0; background: inherit; }
.ico.zip { background: #9a8c6e; height: 18px; width: 14px; }
.ico.json { background: #6e9a7a; height: 18px; width: 14px; }
.ico.epub { background: var(--gilt); height: 18px; width: 14px; }
.indent1 { padding-left: 26px; } .indent2 { padding-left: 44px; } .indent3 { padding-left: 62px; }
.progress { height: 6px; border-radius: 999px; background: var(--screen-soft); overflow: hidden; }
.progress b { display: block; height: 100%; width: 0; background: var(--tick); transition: width 1.6s ease-out; }
.progress b.full { width: 100%; }

/* 裝幀室的縮圖 */
.bind { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; height: 100%; }
@media (max-width: 560px) { .bind { grid-template-columns: minmax(0, 1fr); } }
.bind .col { display: grid; gap: 6px; align-content: start; }
.drop { border: 1.5px dashed var(--screen-line); border-radius: 8px; padding: 14px 8px; text-align: center; color: var(--muted); font-size: 12px; transition: border-color .3s, background .3s; }
.drop.over { border-color: var(--tick); background: color-mix(in srgb, var(--tick) 8%, var(--screen)); color: var(--screen-ink); }
.field { border: 1px solid var(--screen-line); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--muted); min-height: 26px; }
.field.set { color: var(--screen-ink); }
.mini-book { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: start; }
.mini-cover { aspect-ratio: 2 / 3; border-radius: 2px 5px 5px 2px; background: #f1f4f2; border: 1px solid var(--screen-line); display: grid; place-items: center;
  font-family: var(--display); font-size: 15px; color: #1f2a30; letter-spacing: .15em; writing-mode: vertical-rl; transition: background .4s, color .4s; }
.mini-cover.rose { background: #f8f0ee; color: #9b4a5a; }
.mini-page { border-radius: 4px; background: #f1f4f2; color: #1f2a30; padding: 10px; font-family: var(--display); font-size: 11.5px; line-height: 1.8; min-height: 150px; transition: background .4s, color .4s; }
.mini-page.rose { background: #f8f0ee; color: #2e2426; }
.mini-page .no { color: #2f5d73; letter-spacing: .3em; font-size: 10px; text-align: center; margin: 0; }
.mini-page.rose .no { color: #9b4a5a; }
.mini-page h4 { text-align: center; margin: 2px 0 8px; font-weight: 400; letter-spacing: .15em; }
.mini-page p { margin: 0 0 6px; }
/* 範例書頁的各種排版（對應裝幀室的選項） */
.pg2 { --bp: #f1f4f2; --bi: #1f2a30; --ba: #2f5d73; --bs: #dde6e6; --bm: #66757b; background: var(--bp); color: var(--bi); border-radius: 4px; padding: 12px;
  font-family: "Noto Serif TC", "Songti TC", serif; font-size: 11.5px; line-height: 1.85; transition: background .4s, color .4s; position: relative; overflow: hidden; }
.pg2 > * { position: relative; }
.pg2.p-rose { --bp: #f8f0ee; --bi: #2e2426; --ba: #9b4a5a; --bs: #efdcdc; --bm: #7d6a6d; }
.pg2.p-night { --bp: #1c1f24; --bi: #dfe2e6; --ba: #c9a45c; --bs: #2a2f36; --bm: #9199a3; }
.pg2.f-kai { font-family: "LXGW WenKai TC", "Kaiti TC", serif; }
.pg2.f-iansui { font-family: "Iansui", "LXGW WenKai TC", serif; }
.pg2.f-round { font-family: "Huninn", "Noto Sans TC", sans-serif; }
.pg2 .no { color: var(--ba); letter-spacing: .3em; font-size: 10px; text-align: center; margin: 0; }
.pg2 h4 { text-align: center; margin: 2px 0 8px; font-weight: 400; letter-spacing: .15em; font-size: 13px; }
.pg2 p { margin: 0 0 6px; }
.pg2 .you { margin: 6px 0 8px; padding-left: 8px; border-left: 2px solid var(--ba); color: var(--bm); transition: all .3s; }
.pg2 .you .who { font-size: 9px; letter-spacing: .2em; color: var(--ba); display: block; }
.pg2.y-bubble .you { border-left: 0; margin-left: 18%; padding: 6px 9px; background: var(--bs); border-radius: 10px 10px 3px 10px; color: var(--bi); }
.pg2.y-script .you { border-left: 0; padding-left: 0; color: var(--bi); }
.pg2.y-script .you .who { display: inline; font-weight: 700; font-size: 11px; letter-spacing: .05em; }
.pg2.y-script .you .who::after { content: "："; }
.pg2.y-plain .you { border-left: 0; padding-left: 0; color: var(--bi); }
.pg2.y-plain .you .who { display: none; }
.pg2.o-left .no { text-align: left; font-size: 20px; letter-spacing: .05em; font-family: "LXGW WenKai TC", serif; }
.pg2.o-left h4 { text-align: left; }
.pg2.o-line .no { display: inline; font-size: 10px; margin-right: 6px; }
.pg2.o-line h4 { display: inline; }
.pg2.o-line .head { border-bottom: 1px solid var(--bs); padding-bottom: 4px; margin-bottom: 8px; }
.pg2 .head { transition: all .3s; }
.pg2::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, #7c9a8a 0%, #c9b58f 45%, #6d7f9c 100%); opacity: 0; transition: opacity .5s; }
.pg2.photo::before { opacity: .28; }
.pg2 .st { background: var(--bs); border-radius: 5px; padding: 5px 8px; font-size: 10px; line-height: 1.6; transition: opacity .3s; }
.pg2 .st.off { opacity: 0; height: 0; padding: 0; overflow: hidden; }
.pg2 mark { background: color-mix(in srgb, #a9853a 40%, transparent); color: inherit; }
.sw { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--screen-line); color: var(--screen-ink); white-space: nowrap; transition: background .2s, border-color .2s; }
.chip.on { border-color: var(--gilt); background: color-mix(in srgb, var(--gilt) 18%, var(--screen)); }
.lbl { font-size: 11px; color: var(--muted); margin: 4px 0 0; }
.chs { display: grid; gap: 4px; font-size: 11.5px; }
.chs .c { border: 1px solid var(--screen-line); border-radius: 6px; padding: 4px 8px; display: flex; justify-content: space-between; gap: 6px; transition: background .3s; }
.chs .c.hl { background: color-mix(in srgb, var(--gilt) 14%, var(--screen)); }
.cutline { font-size: 10.5px; color: var(--bm); border-top: 1px dashed var(--bs); padding-top: 4px; margin: 6px 0 4px; transition: color .3s, border-color .3s; }
.cutline.on { color: var(--ba); border-top-color: var(--ba); }
.cv { aspect-ratio: 2 / 3; width: 120px; max-width: 100%; justify-self: center; border-radius: 2px 6px 6px 2px; background: #f1f4f2; color: #1f2a30; position: relative; overflow: hidden;
  font-family: "LXGW WenKai TC", serif; box-shadow: var(--shadow); transition: background .4s, color .4s; }
.cv .t { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 17px; letter-spacing: .2em; transition: all .4s; }
.cv .s { position: absolute; left: 0; right: 0; top: 52%; text-align: center; font-size: 9px; opacity: .7; transition: all .4s; }
.cv .fr { position: absolute; inset: 7px; border: 1.5px solid currentColor; outline: 1px solid currentColor; outline-offset: -4px; transition: opacity .3s; }
.cv .img { position: absolute; inset: 0 0 42% 0; background: linear-gradient(160deg, #7c9a8a, #c9b58f 50%, #6d7f9c); opacity: 0; transition: opacity .4s, inset .4s; }
.cv.band .fr { opacity: 0; } .cv.band .img { opacity: 1; } .cv.band .t { top: 64%; text-align: left; padding-left: 12px; font-size: 15px; } .cv.band .s { top: 76%; text-align: left; padding-left: 12px; }
.cv.vert .fr { opacity: 0; } .cv.vert .t { writing-mode: vertical-rl; top: 14%; left: auto; right: 16px; width: auto; } .cv.vert .s { opacity: 0; }
.cv.full { color: #fff; } .cv.full .fr { opacity: 0; } .cv.full .img { opacity: 1; inset: 0; } .cv.full .t { top: 70%; text-align: left; padding-left: 12px; } .cv.full .s { top: 80%; text-align: left; padding-left: 12px; }
.spell { font-family: ui-monospace, Menlo, monospace; font-size: 10px; line-height: 1.6; background: var(--screen-soft); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; }
.hits { display: grid; gap: 2px; font-size: 11px; border: 1px solid var(--screen-line); border-radius: 6px; padding: 4px; opacity: 0; transition: opacity .3s; }
.hits.show { opacity: 1; }
.hits div { padding: 3px 6px; border-radius: 4px; }
.hits div.hl { background: color-mix(in srgb, var(--gilt) 14%, var(--screen)); }
.hits b { color: var(--gilt); font-weight: 500; margin-right: 4px; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 10px); background: var(--screen-ink); color: var(--screen); font-size: 12px; padding: 6px 14px;
  border-radius: 999px; opacity: 0; transition: opacity .3s, transform .3s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 書籍 App */
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.bk { aspect-ratio: 2 / 3; border-radius: 2px 5px 5px 2px; background: var(--screen-soft); }
.bk.new { background: #2f4858; color: #eef2f3; display: grid; place-items: center; font-family: var(--display); writing-mode: vertical-rl; letter-spacing: .2em; font-size: 13px;
  transform: scale(.6); opacity: 0; transition: transform .5s, opacity .5s; }
.bk.new.show { transform: none; opacity: 1; }
.reader { position: absolute; inset: 0; background: #f6f2ea; color: #2b2622; padding: 26px 16px; font-family: var(--display); font-size: 12.5px; line-height: 1.9;
  transform: translateX(100%); transition: transform .5s ease; display: grid; align-content: start; gap: 6px; }
.reader.show { transform: none; }
.reader .you { border-left: 2px solid #8a3b2e; padding-left: 8px; color: #7a6f64; font-size: 11.5px; }
.reader .pg { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 10px; color: #7a6f64; font-family: var(--ui); }

/* 游標 */
.cursor { position: absolute; left: 50%; top: 110%; width: 18px; height: 18px; pointer-events: none; z-index: 5;
  transition: left .7s cubic-bezier(.4,.1,.2,1), top .7s cubic-bezier(.4,.1,.2,1); }
.cursor svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.cursor.tap::after { content: ""; position: absolute; left: -9px; top: -9px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gilt); animation: tap .5s ease-out; }
@keyframes tap { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.1); opacity: 0; } }
.fly { position: absolute; z-index: 4; transition: left .9s cubic-bezier(.4,.1,.2,1), top .9s cubic-bezier(.4,.1,.2,1), opacity .3s; }

/* 字幕與控制 */
.caption { display: grid; gap: 4px; min-height: 5.5em; }
.caption .kicker { font-size: 12px; letter-spacing: .12em; color: var(--gilt); margin: 0; }
.caption h2 { font-family: var(--display); font-size: 1.35rem; margin: 0; text-wrap: balance; }
.caption p { margin: 0; color: var(--muted); max-width: 62ch; }
.caption p b { color: var(--ink); font-weight: 500; }
.caption .warn { color: var(--warn); }
.shot { margin: 8px 0 0; display: grid; gap: 4px; }
.shot img { display: block; max-width: 100%; max-height: 260px; width: auto; border: 1px solid var(--line); border-radius: 8px; }
.shot figcaption { font-size: 12px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 7px 14px; cursor: pointer; }
.btn.main { background: var(--cloth); color: var(--cloth-ink); border-color: var(--cloth); min-width: 6em; }
.btn:focus-visible, .toc button:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }
.bar { flex: 1; min-width: 120px; height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar b { display: block; height: 100%; width: 0; background: var(--gilt); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 目錄 */
.toc { display: grid; gap: 14px; }
.toc h3 { font-size: 12px; letter-spacing: .14em; color: var(--muted); margin: 0 0 4px; font-weight: 500; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: s var(--start); }
.toc li { counter-increment: s; }
.toc button { width: 100%; text-align: left; font: inherit; font-size: 14px; background: none; border: 0; border-radius: 6px; padding: 5px 8px; color: var(--ink); cursor: pointer; display: flex; gap: 8px; }
.toc button::before { content: counter(s); color: var(--gilt); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.toc button:hover { background: var(--panel); }
.toc button[aria-current="step"] { background: var(--panel); box-shadow: inset 2px 0 0 var(--gilt); }
.note { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; margin: 0; }

const GROUPS = ['Google 匯出', '解壓縮', '裝幀', '閱讀'];

// ───────── 播放 ─────────
let idx = 0, playing = !reduce, timers = [], sceneEnd = 0, sceneStart = 0, raf = 0;
const cursor = () => stage.querySelector('.cursor');
const all = sel => sel.split(',').flatMap(s => [...stage.querySelectorAll(s)]);
function place(el, target, dx = .55, dy = .6) {
  const t = stage.querySelector(target); if (!t) return;
  const r = t.getBoundingClientRect(), s = stage.getBoundingClientRect();
  el.style.left = (r.left - s.left + r.width * dx) + 'px'; el.style.top = (r.top - s.top + r.height * dy) + 'px';
}
function run([, act, sel, arg]) {
  const c = cursor();
  if (act === 'cur') place(c, sel);
  else if (act === 'tap') { place(c, sel); c.classList.remove('tap'); void c.offsetWidth; c.classList.add('tap');
    all(sel).forEach(el => { if (el.classList.contains('btn-s')) { el.classList.add('press'); setTimeout(() => el.classList.remove('press'), 180); } }); }
  else if (act === 'check') all(sel).forEach(el => el.classList.add('on'));
  else if (act === 'uncheck') all(sel).forEach(el => el.classList.remove('on'));
  else if (act === 'add') all(sel).forEach(el => el.classList.add(arg));
  else if (act === 'rm') all(sel).forEach(el => el.classList.remove(arg));
  else if (act === 'text') all(sel).forEach(el => { el.textContent = arg; });
  else if (act === 'css') all(sel).forEach(el => { el.style.cssText += ';' + arg; });
  else if (act === 'show') all(sel).forEach(el => { el.hidden = false; });
  else if (act === 'mark') all(sel).forEach(el => { el.querySelectorAll('p, .you').forEach(p => { p.innerHTML = p.innerHTML.split(arg).join('<mark>' + arg + '</mark>'); }); });
  else if (act === 'type') all(sel).forEach(el => { el.classList.add('set'); [...arg].forEach((ch, i) => timers.push(setTimeout(() => { el.textContent = arg.slice(0, i + 1); }, reduce ? 0 : i * 220))); });
  else if (act === 'fly') { // 把檔案拖到目標：複製一個跟著游標飛過去
    const src = stage.querySelector(sel), s = stage.getBoundingClientRect(), r = src.getBoundingClientRect();
    const ghost = src.cloneNode(true); ghost.removeAttribute('id'); ghost.classList.add('fly', 'hl');
    ghost.style.left = (r.left - s.left) + 'px'; ghost.style.top = (r.top - s.top) + 'px'; ghost.style.width = r.width + 'px';
    stage.append(ghost); void ghost.offsetWidth;
    place(ghost, arg, .1, .2); place(c, arg, .5, .55);
    timers.push(setTimeout(() => { ghost.style.opacity = 0; }, 1000));
  }
}
function show(i) {
  timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
  idx = (i + SCENES.length) % SCENES.length;
  const sc = SCENES[idx];
  stage.innerHTML = sc.html() + `<div class="cursor" aria-hidden="true"><svg width="18" height="22" viewBox="0 0 18 22"><path d="M1 1 L1 17 L5.5 13 L8.5 20 L11 19 L8 12 L14 12 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>`;
  $('#caption').innerHTML = `<p class="kicker">${sc.kicker}</p><h2>${sc.title}</h2><p>${sc.text}</p>` +
    (sc.shot ? `<figure class="shot"><img src="${sc.shot}" alt="實際畫面：${sc.title}"><figcaption>實際畫面（2026 年 9 月，繁體中文介面）</figcaption></figure>` : '');
  $('#count').textContent = `${idx + 1} / ${SCENES.length}`;
  document.querySelectorAll('.toc button').forEach(b => b.setAttribute('aria-current', Number(b.dataset.i) === idx ? 'step' : 'false'));
  const last = sc.steps.reduce((m, s) => Math.max(m, s[0]), 0);
  sceneEnd = last + 2600; sceneStart = performance.now();
  if (reduce) { sc.steps.forEach(s => { if (!['cur', 'tap', 'fly'].includes(s[1])) run(s); }); cursor().hidden = true; $('#bar').style.width = '100%'; return; }
  sc.steps.forEach(s => timers.push(setTimeout(() => run(s), s[0] + 400)));
  if (playing) timers.push(setTimeout(() => (VIDEO && idx === SCENES.length - 1) ? cover('跟著做，把妳的對話也留成一本書。') : show(idx + 1), sceneEnd + 400));
  const tick = () => { $('#bar').style.width = Math.min(100, (performance.now() - sceneStart) / (sceneEnd + 400) * 100) + '%'; raf = requestAnimationFrame(tick); };
  tick();
}
function setPlaying(p) { playing = p; $('#play').textContent = p ? '暫停' : '播放'; show(idx); }

// 目錄
$('#toc').innerHTML = GROUPS.map((g, gi) => {
  const items = SCENES.map((s, i) => [s, i]).filter(([s]) => s.group === gi);
  return `<div><h3>${g}</h3><ol style="--start:${items[0][1]}">${items.map(([s, i]) => `<li><button type="button" data-i="${i}">${s.title}</button></li>`).join('')}</ol></div>`;
}).join('') + '<p class="note">畫面是示意圖，實際按鈕的位置跟文字可能因為 Google 改版或手機、電腦而有點不同，找同樣意思的那一顆就對了。</p>';
$('#toc').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) show(Number(b.dataset.i)); });
$('#prev').addEventListener('click', () => show(idx - 1));
$('#next').addEventListener('click', () => show(idx + 1));
$('#play').addEventListener('click', () => setPlaying(!playing));
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; if (e.key === 'ArrowRight') show(idx + 1); if (e.key === 'ArrowLeft') show(idx - 1); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => show(idx), 200); });
if (reduce) $('#play').textContent = '播放';
// 錄影模式的開頭與結尾：那張紙帶摺成小書的圖
function cover(line) {
  timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
  stage.innerHTML = '<img class="endimg" src="hero-full.jpg" alt="對話裝幀室：把對話，留成一本書。">';
  $('#caption').innerHTML = `<h2>${line}</h2>`;
}
if (VIDEO) {
  document.documentElement.dataset.theme = 'light'; document.body.classList.add('video'); playing = true;
  cover('對話裝幀室使用指南'); setTimeout(() => show(0), 3500);
} else {
  (document.fonts?.ready || Promise.resolve()).then(() => show(0));
  show(0);
}
